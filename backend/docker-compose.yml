services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pianke
      POSTGRES_PASSWORD: pianke
      POSTGRES_DB: pianke
    ports:
      - "5432:5432"
    volumes:
      - pianke_postgres:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro

volumes:
  pianke_postgres:
